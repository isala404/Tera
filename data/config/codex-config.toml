# Auto-generated by tera init. Regenerated on every start:
# it encodes absolute paths that move with the workspace.
#
# The agent runs unattended with nobody to answer a prompt, and is expected to
# reach anywhere on this machine and install what a task needs. So: no approvals,
# no sandbox, and the workspace is trusted up front rather than on first use.
approval_policy = "never"
sandbox_mode = "danger-full-access"

# The conversation model. Deliberately not the app-server's own default, which is
# the frontier model: most of what the assistant does is routine, and it picks a
# stronger model per turn for the work that is actually hard. Keep in step with
# codex::tier::CONVERSATION, a test asserts they match.
model = "{{MODEL}}"
model_reasoning_effort = "{{EFFORT}}"

[features]
memories = false
multi_agent = true

[projects."{{WORKSPACE}}"]
trust_level = "trusted"

# Only consulted if something falls back to workspace-write; without it that
# fallback silently loses network access, which breaks every package install.
[sandbox_workspace_write]
network_access = true

[mcp_servers.tera]
command = "{{BIN}}"
args = ["mcp", "--socket", "{{SOCKET}}"]
required = true
startup_timeout_sec = 10
tool_timeout_sec = 120
