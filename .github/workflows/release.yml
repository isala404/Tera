name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install required tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg sqlite3 jq
          mkdir -p "$HOME/.local/bin"
          if ! command -v codex >/dev/null 2>&1; then
            cat << 'EOF' > "$HOME/.local/bin/codex"
          #!/bin/sh
          echo "codex 0.1.0"
          EOF
            chmod +x "$HOME/.local/bin/codex"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Rust tests
        run: cargo test --all-targets --locked
      - name: Python tests
        run: python3 -m unittest tests/audio_skill_test.py tests/model_config_skill_test.py tests/spotify_skill_test.py

  build:
    needs: verify
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          # 22.04 rather than 24.04. An artifact's glibc floor comes from the
          # host that built it, and Raspberry Pi OS Bookworm ships 2.36. Built
          # against 22.04 the binary needs at most 2.34, checked by running one
          # on a bookworm base. A 24.04 host would lift that floor past the Pi.
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check tag matches the package version
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Build
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Package
        run: |
          asset="tera-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/tera" "$asset"
          shasum -a 256 "$asset" > "$asset.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: tera-${{ matrix.target }}
          path: |
            tera-${{ matrix.target }}
            tera-${{ matrix.target }}.sha256

  publish:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job never checks the repository out, so gh has no git remote to
          # infer the target from and fails before it uploads anything. Naming the
          # repository is cheaper than cloning the tree to publish six files.
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
