[package]
name = "tera"
version = "0.1.0"
edition = "2021"
authors = ["Isala Piyarisi <mail@isala.me>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/isala404/Tera"
description = "Persistent personal helper daemon, SQLite event store, Codex App Server integration, MCP server, and memory engine"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
# Held at 0.39, not stale. 0.40 wants libsqlite3-sys 0.38 while
# whatsapp-rust-sqlite-storage pins ^0.37, and only one crate in the graph may
# link the native sqlite3 library. Moves when whatsapp-rust does.
rusqlite = { version = "0.39", features = ["bundled", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.13", features = ["v4", "serde"] }
async-trait = "0.1"
cron = "0.17"
libc = "0.2"
whatsapp-rust = { version = "0.7", default-features = false, features = ["tokio-transport", "sqlite-storage", "ureq-client", "tokio-runtime"] }
whatsapp-rust-sqlite-storage = "0.7"
whatsapp-rust-tokio-transport = { version = "0.7", default-features = false }
whatsapp-rust-ureq-http-client = "0.7"
qrcode = { version = "0.14.1", default-features = false }

[dev-dependencies]
tempfile = "3.27"
