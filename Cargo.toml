[package]
name = "tera"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[features]
default = ["embedded-frontend"]
embedded-frontend = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
forge = { version = "0.2.1", package = "forgex" }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2", features = ["serde"] }
rand = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
axum = "0.8"
bcrypt = "0.17"
jsonwebtoken = "9"
async-trait = "0.1"
prost = "0.14"
qr2term = "0.3.3"
whatsapp-rust = { git = "https://github.com/jlucaso1/whatsapp-rust", rev = "181d527", default-features = false, features = ["tokio-transport", "ureq-client", "tokio-native"] }
wacore = { git = "https://github.com/jlucaso1/whatsapp-rust", rev = "181d527" }
wacore-binary = { git = "https://github.com/jlucaso1/whatsapp-rust", rev = "181d527" }
waproto = { git = "https://github.com/jlucaso1/whatsapp-rust", rev = "181d527" }
whatsapp-rust-tokio-transport = { git = "https://github.com/jlucaso1/whatsapp-rust", rev = "181d527" }
whatsapp-rust-ureq-http-client = { git = "https://github.com/jlucaso1/whatsapp-rust", rev = "181d527" }
rust-embed = { version = "8", optional = true }
mime_guess = { version = "2", optional = true }

[dev-dependencies]
forge = { version = "0.2.1", package = "forgex", features = ["embedded-db"] }

[build-dependencies]
which = "7"
